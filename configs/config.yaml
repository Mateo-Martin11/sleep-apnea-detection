# ── Data ──────────────────────────────────────────────────────────────────────
data:
  train_h5: "X_train.h5"
  test_h5: "X_test.h5"
  train_ids_csv: "data/X_train_h7ipJUo.csv"
  test_ids_csv: "data/X_test_PN3J7aD.csv"
  train_labels_csv: "data/y_train_tX9Br0C.csv"
  stats_path: "checkpoints/norm_stats.npz"
  instance_norm: true
  val_ratio: 0.2
  seed: 42

# ── Model ─────────────────────────────────────────────────────────────────────
model:
  name: "unet1d"          # "cnn1d" or "unet1d"
  n_channels: 8
  base_filters: 32
  dropout: 0.4

# ── Training ──────────────────────────────────────────────────────────────────
training:
  batch_size: 32
  n_epochs: 12
  patience: 15
  lr: 0.001
  weight_decay: 0.001
  grad_clip: 1.0
  augment: true

# ── Loss ──────────────────────────────────────────────────────────────────────
loss:
  name: "combined"        # "bce" | "dice" | "focal" | "combined"
  pos_weight: 10.0        # for BCE / combined — ratio réel ~93/7
  bce_weight: 0.5
  dice_weight: 0.5

# ── Scheduler ─────────────────────────────────────────────────────────────────
scheduler:
  name: "plateau"         # "plateau" | "cosine" | null
  patience: 5
  factor: 0.5
  min_lr: 0.000001

# ── Output ────────────────────────────────────────────────────────────────────
output:
  checkpoint_dir: "checkpoints"
  submission_dir: "submissions"
  model_name: "unet1d_v4"
